<!DOCTYPE html>
<html>
<head>
  <title>Precision Irrigation Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 40px;
    }
    #result {
      margin-top: 30px;
      font-size: 18px;
    }
    .status {
      font-weight: bold;
    }
  </style>
  <script>
    async function fetchIrrigation() {
      const cropType = document.getElementById("crop_type").value;
      const res = await fetch(`/api/irrigation?crop_type=${cropType}`);
      const data = await res.json();
      if (data.error) {
        document.getElementById("result").innerHTML = `<span style="color:red;">Error: ${data.error}</span>`;
        return;
      }

      document.getElementById("result").innerHTML = `
        <p><b>Soil Moisture:</b> ${data.soil_moisture}%</p>
        <p><b>Temperature:</b> ${data.temperature}°C</p>
        <p><b>Humidity:</b> ${data.humidity}%</p>
        <p><b>Timestamp:</b> ${data.timestamp}</p>
        <p class="status"><b>Irrigation Needed:</b> 
          <span style="color:${data.irrigation_needed ? 'green' : 'red'}">
            ${data.irrigation_needed ? '✅ YES' : '❌ NO'}
          </span>
        </p>
      `;
    }
  </script>
</head>
<body>
  <h2>Live Irrigation Predictor</h2>
  <label for="crop_type">Select Crop Type (numeric): </label>
  <input type="number" id="crop_type" value="0" min="0" max="10">
  <br><br>
  <button onclick="fetchIrrigation()">Get Live Prediction</button>

  <div id="result"></div>
</body>
</html>
